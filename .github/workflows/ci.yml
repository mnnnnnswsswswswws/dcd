name: Platform CI

on:
  push:
    branches: [main, "claude/**"]
    paths: ["platform/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcp
          POSTGRES_PASSWORD: vcp
          POSTGRES_DB: vcp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vcp -d vcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://vcp:vcp@localhost:5432/vcp?schema=public"
      # Prisma braucht directUrl für `migrate deploy`; die CI-Postgres ist ungepoolt,
      # daher identisch zu DATABASE_URL.
      DIRECT_URL: "postgresql://vcp:vcp@localhost:5432/vcp?schema=public"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Blockiert den Merge bei KRITISCHEN Dependency-Lücken. Nicht-kritische
      # Restrisiken (Next-15-/Nest-11-Major-Upgrades) sind in docs/SECURITY.md
      # dokumentiert und lassen die Pipeline bewusst nicht dauerhaft rot werden.
      - name: Security audit (kritische Lücken blockieren)
        run: pnpm audit --prod --audit-level critical

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Apply migrations (incl. ledger-immutability triggers)
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm -r typecheck

      # Verbindungsbudget-Gate (Scale S1, Aufgabe 13): schlaegt fehl, bevor eine
      # erhoehte max_instances die Datenbank aussperren koennte. Laeuft frueh und
      # separat, damit die Ursache im CI-Log sofort sichtbar ist.
      - name: Kapazitaets- und Verbindungsbudget
        run: pnpm --filter @vcp/capacity test

      - name: Unit tests (packages + api)
        run: |
          pnpm -r --filter './packages/*' test
          pnpm --filter @vcp/api test

      - name: Integration tests (DB)
        run: pnpm --filter @vcp/api test:integration

      - name: E2E tests (DB)
        run: pnpm --filter @vcp/api test:e2e

      - name: Build frontends
        run: |
          pnpm --filter @vcp/admin build
          pnpm --filter @vcp/web build
